name: Release Android

on:
  push:
    tags:
      - 'android-v*'

concurrency:
  group: release-android
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set.outputs.version }}
      tag: ${{ steps.set.outputs.tag }}
    steps:
      - id: set
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#android-v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set version
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          BASE="${VERSION%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          sed -i "s/versionCode = [0-9]*/versionCode = $CODE/" android-client/app/build.gradle.kts
          sed -i 's/versionName = "[^"]*"/versionName = "'"$VERSION"'"/' android-client/app/build.gradle.kts

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-release-${{ hashFiles('android-client/**/*.gradle.kts', 'android-client/**/gradle-wrapper.properties') }}
          restore-keys: gradle-release-

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android-client/local.properties

      - name: Assemble release APK
        working-directory: android-client
        run: ./gradlew assembleRelease

      - name: Sign APK
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          APK_UNSIGNED=android-client/app/build/outputs/apk/release/app-release-unsigned.apk
          APK_OUT=android-client/app/build/outputs/apk/release/muorg-${VERSION}.apk
          if [[ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
            BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | sort -V | tail -1)
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" sign \
              --ks keystore.jks \
              --ks-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
              --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
              --out "$APK_OUT" \
              "$APK_UNSIGNED"
            rm -f keystore.jks
          else
            echo "No signing secrets configured; uploading unsigned APK"
            mv "$APK_UNSIGNED" "$APK_OUT"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: muorg-${{ needs.version.outputs.version }}-android
          path: android-client/app/build/outputs/apk/release/muorg-${{ needs.version.outputs.version }}*.apk

  release:
    needs: [version, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: muorg-${{ needs.version.outputs.version }}-android
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Muorg Android ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
