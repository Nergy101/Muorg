name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which parts of the monorepo did this push/PR actually touch? Every build
  # job below is gated on this so an Android-only change stops paying for a
  # Tauri build and vice versa.
  #
  # Two things drive the filters beyond the obvious directory:
  #   - `src/**` is the @shared alias, consumed by both client and web-client.
  #   - the desktop client bundles the server as a sidecar, so a server change
  #     has to rebuild the client too.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # A manual run has no diff to inspect (paths-filter would compare main to
    # itself and report nothing changed), so dispatch forces a full build.
    outputs:
      client: ${{ steps.filter.outputs.client == 'true' || github.event_name == 'workflow_dispatch' }}
      web-client: ${{ steps.filter.outputs.web-client == 'true' || github.event_name == 'workflow_dispatch' }}
      android: ${{ steps.filter.outputs.android == 'true' || github.event_name == 'workflow_dispatch' }}
      server: ${{ steps.filter.outputs.server == 'true' || github.event_name == 'workflow_dispatch' }}
      docs-site: ${{ steps.filter.outputs.docs-site == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            client:
              - '.github/workflows/build.yml'
              - 'client/**'
              - 'src/**'
              - 'server/**'
            web-client:
              - '.github/workflows/build.yml'
              - 'web-client/**'
              - 'src/**'
            android:
              - '.github/workflows/build.yml'
              - 'android-client/**'
            server:
              - '.github/workflows/build.yml'
              - 'server/**'
            docs-site:
              - '.github/workflows/build.yml'
              - 'docs-site/**'

  client:
    name: Client (TypeScript + Tauri)
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            client/src-tauri -> target
            server -> target

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libasound2-dev \
            pkg-config libssl-dev libmp3lame-dev

      - name: Install dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Build server sidecar
        working-directory: client
        run: pnpm run build:sidecar

      - name: Check
        working-directory: client
        run: pnpm run check

  web-client:
    name: Web Client (Vue 3)
    needs: changes
    if: needs.changes.outputs.web-client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        working-directory: web-client
        run: pnpm install --frozen-lockfile

      - name: Type check & build
        working-directory: web-client
        run: pnpm build

  android:
    name: Android (lint + build)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android-client/**/*.gradle.kts', 'android-client/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android-client/local.properties

      - name: Lint
        working-directory: android-client
        run: ./gradlew lintDebug

      - name: Build
        working-directory: android-client
        run: ./gradlew assembleDebug

  server:
    name: Server (Rust)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libmp3lame-dev

      - name: cargo check
        working-directory: server
        run: cargo check

      - name: cargo test
        working-directory: server
        run: cargo test

      - name: cargo clippy
        working-directory: server
        run: cargo clippy -- -D clippy::all

  docs-site:
    name: Docs Site (Docusaurus)
    needs: changes
    if: needs.changes.outputs.docs-site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: docs-site
        run: npm ci

      - name: Build
        working-directory: docs-site
        run: npm run build

  # Single stable check to require on the branch: skipped jobs report as
  # "skipped" rather than "success", so branch protection cannot depend on the
  # individual gated jobs above.
  build:
    name: Build
    needs: [changes, client, web-client, android, server, docs-site]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify no build job failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::a build job reported '$r'"
              exit 1
            fi
          done
          echo "all build jobs passed or were skipped as unchanged"
