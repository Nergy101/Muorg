name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  client:
    name: Client (TypeScript + Tauri)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            client/src-tauri -> target
            server -> target

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libasound2-dev \
            pkg-config libssl-dev libmp3lame-dev

      - name: Install dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Build server sidecar
        working-directory: client
        run: pnpm run build:sidecar

      - name: Check
        working-directory: client
        run: pnpm run check

  web-client:
    name: Web Client (Vue 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        working-directory: web-client
        run: pnpm install --frozen-lockfile

      - name: Type check & build
        working-directory: web-client
        run: pnpm build

  android:
    name: Android (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android-client/**/*.gradle.kts', 'android-client/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android-client/local.properties

      - name: Lint
        working-directory: android-client
        run: ./gradlew lintDebug

      - name: Build
        working-directory: android-client
        run: ./gradlew assembleDebug

  server:
    name: Server (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libmp3lame-dev

      - name: cargo check
        working-directory: server
        run: cargo check

      - name: cargo clippy
        working-directory: server
        run: cargo clippy -- -D warnings
