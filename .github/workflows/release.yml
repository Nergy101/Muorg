name: Release

# Each artifact is released independently: the Docker images no longer share
# a dependency chain with the desktop Tauri builds, which live in their own
# workflow (.github/workflows/release-desktop.yml, triggered by desktop-v*
# tags — see scripts/release-desktop.sh).
#
#   version ─┬─ server-binaries ── docker-server
#            ├─ docker-web
#            └─ docker-docs
#
# Pushing a v* tag releases only the artifacts whose source paths changed since
# the previous v* tag. workflow_dispatch releases whichever targets you tick, so
# a single image can be rebuilt on its own.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (defaults to the version in web-client/package.json)'
        required: false
        type: string
      docker_server:
        description: 'Build + push muorg-server image'
        type: boolean
        default: false
      docker_web:
        description: 'Build + push muorg-web image'
        type: boolean
        default: false
      docker_docs:
        description: 'Build + push muorg-docs image'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release mid-publish; a half-pushed manifest is worse than a queue.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set.outputs.version }}
      tag: ${{ steps.set.outputs.tag }}
      prerelease: ${{ steps.set.outputs.prerelease }}
      docker_server: ${{ steps.targets.outputs.docker_server }}
      docker_web: ${{ steps.targets.outputs.docker_web }}
      docker_docs: ${{ steps.targets.outputs.docker_docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags: the targets step diffs against the previous v* tag.
          fetch-depth: 0

      - id: set
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            VERSION="${INPUT_VERSION#v}"
          else
            # Fall back to the committed version so a manual run publishes the
            # same number the app itself reports.
            VERSION="$(node -p "require('./web-client/package.json').version")"
          fi
          # Anything with a semver pre-release suffix is flagged as such.
          if [[ "${VERSION}" == *-* ]]; then PRERELEASE="true"; else PRERELEASE="false"; fi
          {
            echo "version=${VERSION}"
            echo "tag=v${VERSION}"
            echo "prerelease=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

      # What a tag release publishes is derived from the paths that actually
      # changed since the previous v* tag, so a web-only fix no longer drags the
      # ~25-minute Tauri matrix along with it. A manual run publishes only the
      # boxes that were ticked.
      #
      # The tagged commit is itself the version bump — scripts/release.sh rewrites
      # every manifest — which would otherwise mark client/, server/ and
      # web-client/ dirty on every single release and defeat the whole filter.
      # When the tagged commit touches nothing but those manifests we compare from
      # its parent instead, leaving exactly the real work between two releases.
      #
      # A change to this workflow deliberately does NOT force a rebuild: the bits
      # inside each artifact come from its own source tree. Use workflow_dispatch
      # to force one.
      - id: targets
        env:
          TAG_REF: ${{ github.ref_name }}
        run: |
          set -uo pipefail

          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            {
              echo "docker_server=${{ inputs.docker_server }}"
              echo "docker_web=${{ inputs.docker_web }}"
              echo "docker_docs=${{ inputs.docker_docs }}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Files scripts/release.sh rewrites purely to carry the new number.
          BUMP_ONLY='^(client/package\.json|client/src-tauri/tauri\.conf\.json|client/src-tauri/Cargo\.toml|client/src-tauri/Cargo\.lock|server/crates/muorg-server/Cargo\.toml|server/Cargo\.lock|server/openapi\.json|src/api/schema\.d\.ts|android-client/app/src/main/java/nl/muorg/android/data/api/schema/(ApiSchema|MuorgApi)\.kt|android-client/app/build\.gradle\.kts|web-client/package\.json|web-client/package-lock\.json)$'

          HEAD_REF="${TAG_REF}"
          TAG_FILES="$(git diff --name-only "${TAG_REF}^" "${TAG_REF}" 2>/dev/null || true)"
          if [[ -n "${TAG_FILES}" ]] && ! grep -qvE "${BUMP_ONLY}" <<< "${TAG_FILES}"; then
            HEAD_REF="${TAG_REF}^"
            echo "Tagged commit is a pure version bump; comparing from its parent."
          fi

          # --match 'v*' keeps android-v* tags out of the comparison.
          PREV="$(git describe --tags --abbrev=0 --match 'v*' "${TAG_REF}^" 2>/dev/null || true)"

          if [[ -z "${PREV}" ]]; then
            echo "::warning::No previous v* tag found — releasing every artifact."
            {
              echo "docker_server=true"
              echo "docker_web=true"
              echo "docker_docs=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED="$(git diff --name-only "${PREV}" "${HEAD_REF}")"
          echo "Changed paths ${PREV}..${HEAD_REF}:"
          echo "${CHANGED}"

          changed() { grep -qE "$1" <<< "${CHANGED}"; }

          docker_server=false; docker_web=false; docker_docs=false
          # Desktop is not a target here — it releases via release-desktop.yml.
          if changed '^server/';                then docker_server=true; fi
          if changed '^(web-client/|src/)';     then docker_web=true;    fi
          if changed '^docs-site/';             then docker_docs=true;   fi

          echo "Targets: docker_server=${docker_server} docker_web=${docker_web} docker_docs=${docker_docs}"
          {
            echo "docker_server=${docker_server}"
            echo "docker_web=${docker_web}"
            echo "docker_docs=${docker_docs}"
          } >> "$GITHUB_OUTPUT"

  # Linux server binaries for the Docker image only. Lifted out of the desktop
  # matrix so muorg-server can publish without a Tauri build in the graph.
  server-binaries:
    needs: version
    if: needs.version.outputs.docker_server == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libmp3lame-dev

      - name: Set up arm64 cross-compilation
        run: |
          sudo dpkg --add-architecture arm64
          printf '%s\n' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse' \
            | sudo tee /etc/apt/sources.list.d/ubuntu-arm64.list
          # Update only the new arm64 source — leaves existing sources (e.g. microsoft-prod.list) untouched
          sudo apt-get update \
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu-arm64.list \
            -o Dir::Etc::sourceparts=- \
            -o APT::Get::List-Cleanup=0
          sudo apt-get install -y gcc-aarch64-linux-gnu libmp3lame-dev:arm64 libssl-dev:arm64
          rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu

      - name: Build server binary (x86_64-linux)
        working-directory: server
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Build server binary (aarch64-linux)
        working-directory: server
        run: cargo build --release --target aarch64-unknown-linux-gnu
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig

      - name: Upload Docker server binaries
        uses: actions/upload-artifact@v7
        with:
          name: docker-server-binaries
          path: |
            server/target/x86_64-unknown-linux-gnu/release/muorg-server
            server/target/aarch64-unknown-linux-gnu/release/muorg-server

  release:
    needs: version
    runs-on: ubuntu-latest
    # Every v* tag still gets a GitHub Release page, even when no Docker image
    # was rebuilt. Desktop installers are not part of this release — they ship
    # from release-desktop.yml on desktop-v* tags.
    if: ${{ always() && needs.version.result == 'success' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Organize release files
        env:
          VERSION: ${{ needs.version.outputs.version }}
          DOCKER_SERVER: ${{ needs.version.outputs.docker_server }}
          DOCKER_WEB: ${{ needs.version.outputs.docker_web }}
          DOCKER_DOCS: ${{ needs.version.outputs.docker_docs }}
        run: |
          mkdir -p dist

          # ── Docker image references (only what this release actually built) ─
          {
            echo "Images published by this release:"
            if [ "${DOCKER_SERVER}" = "true" ]; then
              echo "  docker pull ghcr.io/nergy101/muorg-server:${VERSION}"
            fi
            if [ "${DOCKER_WEB}" = "true" ]; then
              echo "  docker pull ghcr.io/nergy101/muorg-web:${VERSION}"
            fi
            if [ "${DOCKER_DOCS}" = "true" ]; then
              echo "  docker pull ghcr.io/nergy101/muorg-docs:${VERSION}"
            fi
            echo ""
            echo "Tags pushed: ${VERSION}  latest"
          } > dist/docker.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Muorg ${{ needs.version.outputs.tag }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          generate_release_notes: true
          files: dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-server:
    needs: [version, server-binaries]
    runs-on: ubuntu-latest
    if: needs.version.outputs.docker_server == 'true'
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Download server binaries
        uses: actions/download-artifact@v8
        with:
          name: docker-server-binaries
          path: server/binaries

      - name: Rename and chmod binaries
        run: |
          mv server/binaries/x86_64-unknown-linux-gnu/release/muorg-server server/binaries/muorg-server-amd64
          mv server/binaries/aarch64-unknown-linux-gnu/release/muorg-server server/binaries/muorg-server-arm64
          chmod +x server/binaries/muorg-server-amd64 server/binaries/muorg-server-arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: server
          file: server/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/nergy101/muorg-server:${{ needs.version.outputs.version }}
            ghcr.io/nergy101/muorg-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-web:
    needs: version
    runs-on: ubuntu-latest
    if: needs.version.outputs.docker_web == 'true'
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: web-client/Dockerfile
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/nergy101/muorg-web:${{ needs.version.outputs.version }}
            ghcr.io/nergy101/muorg-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-docs:
    needs: version
    runs-on: ubuntu-latest
    if: needs.version.outputs.docker_docs == 'true'
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docs-site/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/nergy101/muorg-docs:${{ needs.version.outputs.version }}
            ghcr.io/nergy101/muorg-docs:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
