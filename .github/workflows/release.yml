name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust-target: aarch64-apple-darwin
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust-target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
            rust-target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            args: ''
            rust-target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server -> target
            client/src-tauri -> target

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: client
        run: pnpm install

      - name: Build server binary
        working-directory: server
        run: cargo build --release --target ${{ matrix.rust-target }}

      - name: Copy sidecar binary (Unix)
        if: matrix.platform != 'windows-latest'
        run: |
          mkdir -p client/src-tauri/binaries
          cp server/target/${{ matrix.rust-target }}/release/muorg-server \
             client/src-tauri/binaries/muorg-server-${{ matrix.rust-target }}
          chmod +x client/src-tauri/binaries/muorg-server-${{ matrix.rust-target }}

      - name: Copy sidecar binary (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          New-Item -ItemType Directory -Force -Path client/src-tauri/binaries
          Copy-Item server/target/${{ matrix.rust-target }}/release/muorg-server.exe `
            client/src-tauri/binaries/muorg-server-${{ matrix.rust-target }}.exe

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: client
          tagName: v__VERSION__
          releaseName: 'Muorg v__VERSION__'
          releaseBody: |
            See [CHANGELOG.md](https://github.com/Nergy101/Muorg/blob/main/CHANGELOG.md) for details.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
