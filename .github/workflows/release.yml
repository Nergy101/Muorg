name: Release

# Each artifact is released independently: the desktop apps and the three
# Docker images no longer share a dependency chain, so publishing a web image
# does not wait ~25 minutes behind the macOS and Windows Tauri builds.
#
#   version ─┬─ desktop ── release            (dmg / msi / AppImage + latest.json)
#            ├─ server-binaries ── docker-server
#            ├─ docker-web
#            └─ docker-docs
#
# Pushing a v* tag releases everything. workflow_dispatch releases whichever
# targets you tick, so a single image can be rebuilt on its own.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (defaults to the version in web-client/package.json)'
        required: false
        type: string
      desktop:
        description: 'Build + release the desktop apps'
        type: boolean
        default: false
      docker_server:
        description: 'Build + push muorg-server image'
        type: boolean
        default: false
      docker_web:
        description: 'Build + push muorg-web image'
        type: boolean
        default: false
      docker_docs:
        description: 'Build + push muorg-docs image'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release mid-publish; a half-pushed manifest is worse than a queue.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set.outputs.version }}
      tag: ${{ steps.set.outputs.tag }}
      prerelease: ${{ steps.set.outputs.prerelease }}
      desktop: ${{ steps.targets.outputs.desktop }}
      docker_server: ${{ steps.targets.outputs.docker_server }}
      docker_web: ${{ steps.targets.outputs.docker_web }}
      docker_docs: ${{ steps.targets.outputs.docker_docs }}
    steps:
      - uses: actions/checkout@v7

      - id: set
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            VERSION="${INPUT_VERSION#v}"
          else
            # Fall back to the committed version so a manual run publishes the
            # same number the app itself reports.
            VERSION="$(node -p "require('./web-client/package.json').version")"
          fi
          # Anything with a semver pre-release suffix is flagged as such.
          if [[ "${VERSION}" == *-* ]]; then PRERELEASE="true"; else PRERELEASE="false"; fi
          {
            echo "version=${VERSION}"
            echo "tag=v${VERSION}"
            echo "prerelease=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

      # A tag release publishes every artifact; a manual run publishes only the
      # boxes that were ticked.
      - id: targets
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            {
              echo "desktop=true"
              echo "docker_server=true"
              echo "docker_web=true"
              echo "docker_docs=true"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "desktop=${{ inputs.desktop }}"
              echo "docker_server=${{ inputs.docker_server }}"
              echo "docker_web=${{ inputs.docker_web }}"
              echo "docker_docs=${{ inputs.docker_docs }}"
            } >> "$GITHUB_OUTPUT"
          fi

  # Linux server binaries for the Docker image only. Lifted out of the desktop
  # matrix so muorg-server can publish without a Tauri build in the graph.
  server-binaries:
    needs: version
    if: needs.version.outputs.docker_server == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libmp3lame-dev

      - name: Set up arm64 cross-compilation
        run: |
          sudo dpkg --add-architecture arm64
          printf '%s\n' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse' \
            | sudo tee /etc/apt/sources.list.d/ubuntu-arm64.list
          # Update only the new arm64 source — leaves existing sources (e.g. microsoft-prod.list) untouched
          sudo apt-get update \
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu-arm64.list \
            -o Dir::Etc::sourceparts=- \
            -o APT::Get::List-Cleanup=0
          sudo apt-get install -y gcc-aarch64-linux-gnu libmp3lame-dev:arm64 libssl-dev:arm64
          rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu

      - name: Build server binary (x86_64-linux)
        working-directory: server
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Build server binary (aarch64-linux)
        working-directory: server
        run: cargo build --release --target aarch64-unknown-linux-gnu
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig

      - name: Upload Docker server binaries
        uses: actions/upload-artifact@v7
        with:
          name: docker-server-binaries
          path: |
            server/target/x86_64-unknown-linux-gnu/release/muorg-server
            server/target/aarch64-unknown-linux-gnu/release/muorg-server

  desktop:
    needs: version
    if: needs.version.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            server-target: aarch64-apple-darwin
            artifact_name: aarch64-darwin
          - platform: windows-latest
            target: ""
            server-target: x86_64-pc-windows-msvc
            artifact_name: x86_64-windows
          - platform: ubuntu-22.04
            target: ""
            server-target: x86_64-unknown-linux-gnu
            artifact_name: x86_64-linux
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Set version in manifests
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const v = process.env.VERSION;
            const p = require('./client/package.json');
            p.version = v;
            fs.writeFileSync('./client/package.json', JSON.stringify(p, null, 2));
            const tauri = require('./client/src-tauri/tauri.conf.json');
            tauri.version = v;
            fs.writeFileSync('./client/src-tauri/tauri.conf.json', JSON.stringify(tauri, null, 2));
            const cargo = fs.readFileSync('./client/src-tauri/Cargo.toml', 'utf8');
            fs.writeFileSync('./client/src-tauri/Cargo.toml', cargo.replace(/^version = \".*\"$/m, 'version = \"' + v + '\"'));
            const pw = require('./web-client/package.json');
            pw.version = v;
            fs.writeFileSync('./web-client/package.json', JSON.stringify(pw, null, 2));
          "
        env:
          VERSION: ${{ needs.version.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target for server
        run: rustup target add ${{ matrix.server-target }}

      - name: Add Rust target for Tauri (cross-compilation)
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server -> target
            client/src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libasound2-dev \
            pkg-config libssl-dev libmp3lame-dev

      - name: Install OpenSSL via vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-Not (Test-Path C:\vcpkg)) {
            git clone https://github.com/microsoft/vcpkg C:\vcpkg
            C:\vcpkg\bootstrap-vcpkg.bat
          }
          C:\vcpkg\vcpkg.exe install openssl:x64-windows-static
          C:\vcpkg\vcpkg.exe integrate install
          echo "OPENSSL_DIR=C:\vcpkg\installed\x64-windows-static" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "X86_64_PC_WINDOWS_MSVC_OPENSSL_DIR=C:\vcpkg\installed\x64-windows-static" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "VCPKGRS_DYNAMIC=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build server binary
        working-directory: server
        shell: bash
        run: cargo build --release --target ${{ matrix.server-target }}

      - name: Copy sidecar binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p client/src-tauri/binaries
          TARGET="${{ matrix.server-target }}"
          cp server/target/${TARGET}/release/muorg-server \
             client/src-tauri/binaries/muorg-server-${TARGET}
          chmod +x client/src-tauri/binaries/muorg-server-${TARGET}

      - name: Copy sidecar binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path client/src-tauri/binaries
          $target = "${{ matrix.server-target }}"
          Copy-Item "server/target/$target/release/muorg-server.exe" `
            "client/src-tauri/binaries/muorg-server-${target}.exe"

      - name: Install frontend dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        working-directory: client
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            pnpm tauri build --target ${{ matrix.target }}
          else
            pnpm tauri build
          fi
        env:
          CI: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          APPLE_SIGNING_IDENTITY: "-"
          OPENSSL_STATIC: ${{ runner.os == 'macOS' && '1' || '' }}

      - name: Set bundle path
        id: bundle
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            echo "path=client/src-tauri/target/${{ matrix.target }}/release/bundle" >> "$GITHUB_OUTPUT"
          else
            echo "path=client/src-tauri/target/release/bundle" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: muorg-${{ needs.version.outputs.version }}-${{ matrix.artifact_name }}
          path: |
            ${{ steps.bundle.outputs.path }}/dmg/*.dmg
            ${{ steps.bundle.outputs.path }}/macos/*.app
            ${{ steps.bundle.outputs.path }}/macos/*.app.tar.gz
            ${{ steps.bundle.outputs.path }}/macos/*.app.tar.gz.sig

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: muorg-${{ needs.version.outputs.version }}-${{ matrix.artifact_name }}
          path: |
            ${{ steps.bundle.outputs.path }}/msi/*.msi
            ${{ steps.bundle.outputs.path }}/nsis/*.exe
            ${{ steps.bundle.outputs.path }}/msi/*.msi.sig
            ${{ steps.bundle.outputs.path }}/nsis/*.exe.sig

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v7
        with:
          name: muorg-${{ needs.version.outputs.version }}-${{ matrix.artifact_name }}
          path: |
            ${{ steps.bundle.outputs.path }}/appimage/*.AppImage
            ${{ steps.bundle.outputs.path }}/deb/*.deb
            ${{ steps.bundle.outputs.path }}/appimage/*.AppImage.sig

  release:
    needs: [version, desktop]
    runs-on: ubuntu-latest
    if: needs.version.outputs.desktop == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: muorg-*

      - name: Organize release files
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          mkdir -p dist extras

          # ── Main installers (clean, consistent filenames) ──────────────────
          find artifacts -name '*.dmg' \
            -exec cp {} "dist/muorg-${VERSION}-macos.dmg" \; 2>/dev/null || true
          find artifacts -name '*.msi' ! -name '*.sig' \
            -exec cp {} "dist/muorg-${VERSION}-windows.msi" \; 2>/dev/null || true
          find artifacts -name '*.AppImage' ! -name '*.sig' \
            -exec cp {} "dist/muorg-${VERSION}-linux.AppImage" \; 2>/dev/null || true

          # ── Tauri auto-updater bundle (macOS — referenced by latest.json) ──
          find artifacts -name '*.app.tar.gz' ! -name '*.sig' \
            -exec cp {} "dist/muorg-${VERSION}-macos.app.tar.gz" \; 2>/dev/null || true

          # ── Extras zip (signatures, alternate installers, .deb) ────────────
          find artifacts \( -name '*.sig' -o -name '*.exe' -o -name '*.deb' \) \
            -exec cp {} extras/ \; 2>/dev/null || true
          if [ "$(ls -A extras)" ]; then
            zip -j "dist/muorg-${VERSION}-extras.zip" extras/*
          fi

          # ── Docker image references ────────────────────────────────────────
          cat > dist/docker.txt << EOF
          Server image:  docker pull ghcr.io/nergy101/muorg-server:${VERSION}
          Web image:     docker pull ghcr.io/nergy101/muorg-web:${VERSION}
          Docs image:    docker pull ghcr.io/nergy101/muorg-docs:${VERSION}

          Tags pushed: ${VERSION}  latest
          EOF

      - name: Generate latest.json for updater
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          TAG="${{ needs.version.outputs.tag }}"
          REPO="${{ github.repository }}"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          cd artifacts

          linux_sig="$(find . -name '*.AppImage.sig' | head -1)"
          win_msi_sig="$(find . -name '*.msi.sig' | head -1)"
          mac_sig="$(find . -name '*.app.tar.gz.sig' | head -1)"

          if [ -z "$linux_sig" ] || [ -z "$win_msi_sig" ] || [ -z "$mac_sig" ]; then
            echo "Missing one or more updater signatures; cannot generate latest.json" >&2
            exit 1
          fi

          linux_sig_content="$(tr -d '\n' < "$linux_sig")"
          win_sig_content="$(tr -d '\n' < "$win_msi_sig")"
          mac_sig_content="$(tr -d '\n' < "$mac_sig")"

          pub_date="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          # File names match what Organize step uploaded to dist/
          cat > ../dist/latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "Muorg ${VERSION}",
            "pub_date": "${pub_date}",
            "platforms": {
              "linux-x86_64": {
                "signature": "${linux_sig_content}",
                "url": "${BASE_URL}/muorg-${VERSION}-linux.AppImage"
              },
              "windows-x86_64": {
                "signature": "${win_sig_content}",
                "url": "${BASE_URL}/muorg-${VERSION}-windows.msi"
              },
              "darwin-aarch64": {
                "signature": "${mac_sig_content}",
                "url": "${BASE_URL}/muorg-${VERSION}-macos.app.tar.gz"
              }
            }
          }
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Muorg ${{ needs.version.outputs.tag }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          generate_release_notes: true
          files: dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-server:
    needs: [version, server-binaries]
    runs-on: ubuntu-latest
    if: needs.version.outputs.docker_server == 'true'
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Download server binaries
        uses: actions/download-artifact@v8
        with:
          name: docker-server-binaries
          path: server/binaries

      - name: Rename and chmod binaries
        run: |
          mv server/binaries/x86_64-unknown-linux-gnu/release/muorg-server server/binaries/muorg-server-amd64
          mv server/binaries/aarch64-unknown-linux-gnu/release/muorg-server server/binaries/muorg-server-arm64
          chmod +x server/binaries/muorg-server-amd64 server/binaries/muorg-server-arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: server
          file: server/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/nergy101/muorg-server:${{ needs.version.outputs.version }}
            ghcr.io/nergy101/muorg-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-web:
    needs: version
    runs-on: ubuntu-latest
    if: needs.version.outputs.docker_web == 'true'
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: web-client/Dockerfile
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/nergy101/muorg-web:${{ needs.version.outputs.version }}
            ghcr.io/nergy101/muorg-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-docs:
    needs: version
    runs-on: ubuntu-latest
    if: needs.version.outputs.docker_docs == 'true'
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docs-site/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/nergy101/muorg-docs:${{ needs.version.outputs.version }}
            ghcr.io/nergy101/muorg-docs:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
