version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      client:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/web-client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      web-client:
        patterns: ["*"]

  - package-ecosystem: "cargo"
    directory: "/server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      server:
        patterns: ["*"]

  - package-ecosystem: "gradle"
    directory: "/android-client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      android:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns: ["*"]
