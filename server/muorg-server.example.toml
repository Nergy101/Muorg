[server]
# Use 0.0.0.0 when running in Docker; use 127.0.0.1 for local-only standalone use.
host = "0.0.0.0"
port = 7700
# IMPORTANT: change this to a long random string before exposing to the internet.
# All API requests must include: Authorization: Bearer ***
api_key = "change-me-to-something-secret"
# Graceful shutdown: wait up to this many seconds for in-flight requests before force-exiting.
shutdown_timeout_secs = 30

[library]
# Paths to scan for music files. Sub-folders are scanned recursively.
# In Docker: match these to the volume paths you mount in docker-compose.yml.
# In sidecar mode (desktop app): managed automatically — no need to edit this.
content_paths = [
    "/music",
]
# Rescan all content_paths on startup (true) or only when triggered via API (false).
scan_on_startup = true

[storage]
# In Docker: keep these inside the /data volume so they persist across restarts.
db_path = "/data/muorg.db"
backup_dir = "/data/backups"

[cors]
# Origins allowed to call the API.
# Use ["*"] for LAN / home-server use; restrict to your domain for public deployments.
allowed_origins = ["*"]
