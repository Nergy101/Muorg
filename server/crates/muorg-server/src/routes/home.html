<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muorg Server</title>
  <!-- Favicon: the current Muorg orc logo (same artwork as docs-site/static/img/logo.svg), inlined so no extra route is needed. -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http://www.w3.org/2000/svg%22%20viewBox%3D%220%200%20200%20200%22%3E%20%20%20%3Cpath%20d%3D%22M32,28%20L84,50%20L50,94%20Z%22%20fill%3D%22%235b7c32%22/%3E%20%20%20%3Cpath%20d%3D%22M168,28%20L116,50%20L150,94%20Z%22%20fill%3D%22%235b7c32%22/%3E%20%20%20%3Ccircle%20cx%3D%22100%22%20cy%3D%22108%22%20r%3D%2272%22%20fill%3D%22%23759346%22/%3E%20%20%20%3Ccircle%20cx%3D%22100%22%20cy%3D%22108%22%20r%3D%2262%22%20fill%3D%22none%22%20stroke%3D%22%235b7c32%22%20stroke-width%3D%223%22%20opacity%3D%220.45%22/%3E%20%20%20%3Ccircle%20cx%3D%22100%22%20cy%3D%22108%22%20r%3D%2252%22%20fill%3D%22none%22%20stroke%3D%22%235b7c32%22%20stroke-width%3D%223%22%20opacity%3D%220.45%22/%3E%20%20%20%3Ccircle%20cx%3D%22100%22%20cy%3D%22108%22%20r%3D%2240%22%20fill%3D%22%235b7c32%22/%3E%20%20%20%3Cpath%20d%3D%22M71,106%20Q82,92%2093,106%22%20fill%3D%22none%22%20stroke%3D%22%231c1917%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22/%3E%20%20%20%3Cpath%20d%3D%22M107,106%20Q118,92%20129,106%22%20fill%3D%22none%22%20stroke%3D%22%231c1917%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22/%3E%20%20%20%3Cellipse%20cx%3D%22100%22%20cy%3D%22117%22%20rx%3D%225%22%20ry%3D%224%22%20fill%3D%22%23759346%22/%3E%20%20%20%3Cpath%20d%3D%22M81,127%20Q100,144%20119,127%22%20fill%3D%22none%22%20stroke%3D%22%231c1917%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22/%3E%20%20%20%3Cpath%20d%3D%22M84,129%20L88,115%20L94,135%20Z%22%20fill%3D%22%23f5f5f4%22/%3E%20%20%20%3Cpath%20d%3D%22M116,129%20L112,115%20L106,135%20Z%22%20fill%3D%22%23f5f5f4%22/%3E%20%3C/svg%3E" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Token sets ── */
    :root {
      --bg:        #f4f4f4;
      --card-bg:   #ffffff;
      --card-border: #e0e0e0;
      --text:      #222;
      --muted:     #888;
      --version:   #bbb;
      --toggle-bg: #e0e0e0;
      --toggle-fg: #444;
    }
    @media (prefers-color-scheme: dark) {
      :root { /* applied only when data-theme="auto" */
        --bg:        #111;
        --card-bg:   #1a1a1a;
        --card-border: #2a2a2a;
        --text:      #e8e8e8;
        --muted:     #aaa;
        --version:   #555;
        --toggle-bg: #2a2a2a;
        --toggle-fg: #aaa;
      }
    }
    [data-theme="dark"] {
      --bg:        #111;
      --card-bg:   #1a1a1a;
      --card-border: #2a2a2a;
      --text:      #e8e8e8;
      --muted:     #aaa;
      --version:   #555;
      --toggle-bg: #2a2a2a;
      --toggle-fg: #aaa;
    }
    [data-theme="light"] {
      --bg:        #f4f4f4;
      --card-bg:   #ffffff;
      --card-border: #e0e0e0;
      --text:      #222;
      --muted:     #888;
      --version:   #bbb;
      --toggle-bg: #e0e0e0;
      --toggle-fg: #444;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      transition: background 0.2s, color 0.2s;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      padding: 56px 64px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      transition: background 0.2s, border-color 0.2s;
    }

    .logo { width: 96px; height: 96px; }

    .wordmark {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #759346;
    }

    .status {
      font-size: 1rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #759346;
      margin-right: 8px;
      animation: pulse 2s ease-in-out infinite;
    }

    .version {
      font-size: 0.75rem;
      color: var(--version);
      letter-spacing: 0.04em;
    }

    .theme-toggle {
      display: flex;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      overflow: hidden;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      transition: border-color 0.2s;
    }
    .theme-toggle button {
      padding: 5px 12px;
      border: none;
      background: var(--toggle-bg);
      color: var(--toggle-fg);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .theme-toggle button + button {
      border-left: 1px solid var(--card-border);
    }
    .theme-toggle button.active {
      background: #759346;
      color: #fff;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- The current Muorg logo (vinyl record with orc ears), same artwork as
         docs-site/static/img/logo.svg and the web client's favicon.svg. -->
    <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
      <path d="M32,28 L84,50 L50,94 Z" fill="#5b7c32"/>
      <path d="M168,28 L116,50 L150,94 Z" fill="#5b7c32"/>
      <circle cx="100" cy="108" r="72" fill="#759346"/>
      <circle cx="100" cy="108" r="62" fill="none" stroke="#5b7c32" stroke-width="3" opacity="0.45"/>
      <circle cx="100" cy="108" r="52" fill="none" stroke="#5b7c32" stroke-width="3" opacity="0.45"/>
      <circle cx="100" cy="108" r="40" fill="#5b7c32"/>
      <path d="M71,106 Q82,92 93,106" fill="none" stroke="#1c1917" stroke-width="5" stroke-linecap="round"/>
      <path d="M107,106 Q118,92 129,106" fill="none" stroke="#1c1917" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="100" cy="117" rx="5" ry="4" fill="#759346"/>
      <path d="M81,127 Q100,144 119,127" fill="none" stroke="#1c1917" stroke-width="5" stroke-linecap="round"/>
      <path d="M84,129 L88,115 L94,135 Z" fill="#f5f5f4"/>
      <path d="M116,129 L112,115 L106,135 Z" fill="#f5f5f4"/>
    </svg>

    <div class="wordmark">Muorg</div>

    <div class="status">
      <span class="dot"></span>Server is ready for connections
    </div>

    <div class="version">v{{VERSION}}</div>

    <div class="theme-toggle" role="group" aria-label="Color theme">
      <button id="btn-light" onclick="setTheme('light')">Light</button>
      <button id="btn-auto"  onclick="setTheme('auto')">Auto</button>
      <button id="btn-dark"  onclick="setTheme('dark')">Dark</button>
    </div>
  </div>

  <script>
    const ORDER = ['light', 'auto', 'dark'];

    function setTheme(t) {
      document.documentElement.dataset.theme = t;
      localStorage.setItem('muorg-theme', t);
      ORDER.forEach(function(name) {
        document.getElementById('btn-' + name).classList.toggle('active', name === t);
      });
    }

    (function () {
      var saved = localStorage.getItem('muorg-theme') || 'auto';
      setTheme(ORDER.includes(saved) ? saved : 'auto');
    })();
  </script>
</body>
</html>
