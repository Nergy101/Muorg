<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muorg Server</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Token sets ── */
    :root {
      --bg:        #f4f4f4;
      --card-bg:   #ffffff;
      --card-border: #e0e0e0;
      --text:      #222;
      --muted:     #888;
      --version:   #bbb;
      --toggle-bg: #e0e0e0;
      --toggle-fg: #444;
    }
    @media (prefers-color-scheme: dark) {
      :root { /* applied only when data-theme="auto" */
        --bg:        #111;
        --card-bg:   #1a1a1a;
        --card-border: #2a2a2a;
        --text:      #e8e8e8;
        --muted:     #aaa;
        --version:   #555;
        --toggle-bg: #2a2a2a;
        --toggle-fg: #aaa;
      }
    }
    [data-theme="dark"] {
      --bg:        #111;
      --card-bg:   #1a1a1a;
      --card-border: #2a2a2a;
      --text:      #e8e8e8;
      --muted:     #aaa;
      --version:   #555;
      --toggle-bg: #2a2a2a;
      --toggle-fg: #aaa;
    }
    [data-theme="light"] {
      --bg:        #f4f4f4;
      --card-bg:   #ffffff;
      --card-border: #e0e0e0;
      --text:      #222;
      --muted:     #888;
      --version:   #bbb;
      --toggle-bg: #e0e0e0;
      --toggle-fg: #444;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      transition: background 0.2s, color 0.2s;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      padding: 56px 64px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      transition: background 0.2s, border-color 0.2s;
    }

    .logo { width: 96px; height: 96px; }

    .wordmark {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #759346;
    }

    .status {
      font-size: 1rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #759346;
      margin-right: 8px;
      animation: pulse 2s ease-in-out infinite;
    }

    .version {
      font-size: 0.75rem;
      color: var(--version);
      letter-spacing: 0.04em;
    }

    .theme-toggle {
      display: flex;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      overflow: hidden;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      transition: border-color 0.2s;
    }
    .theme-toggle button {
      padding: 5px 12px;
      border: none;
      background: var(--toggle-bg);
      color: var(--toggle-fg);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .theme-toggle button + button {
      border-left: 1px solid var(--card-border);
    }
    .theme-toggle button.active {
      background: #759346;
      color: #fff;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
  </style>
</head>
<body>
  <div class="card">
    <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
      <defs>
        <radialGradient id="metalCenter" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="100%" stop-color="#999999"/>
        </radialGradient>
      </defs>
      <path d="M150,200 L450,450 L512,512 L574,450 L874,200 L750,700 L512,880 L274,700 Z"
            fill="#5b7c32" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
      <circle cx="512" cy="512" r="300" fill="#759346" stroke="#ffffff" stroke-width="15"/>
      <circle cx="512" cy="512" r="220" fill="none" stroke="#5b7c32" stroke-width="8" opacity="0.4"/>
      <circle cx="512" cy="512" r="150" fill="none" stroke="#5b7c32" stroke-width="8" opacity="0.4"/>
      <circle cx="512" cy="512" r="75" fill="#5b7c32"/>
      <circle cx="512" cy="512" r="18" fill="url(#metalCenter)"/>
    </svg>

    <div class="wordmark">Muorg</div>

    <div class="status">
      <span class="dot"></span>Server is ready for connections
    </div>

    <div class="version">v{{VERSION}}</div>

    <div class="theme-toggle" role="group" aria-label="Color theme">
      <button id="btn-light" onclick="setTheme('light')">Light</button>
      <button id="btn-auto"  onclick="setTheme('auto')">Auto</button>
      <button id="btn-dark"  onclick="setTheme('dark')">Dark</button>
    </div>
  </div>

  <script>
    const ORDER = ['light', 'auto', 'dark'];

    function setTheme(t) {
      document.documentElement.dataset.theme = t;
      localStorage.setItem('muorg-theme', t);
      ORDER.forEach(function(name) {
        document.getElementById('btn-' + name).classList.toggle('active', name === t);
      });
    }

    (function () {
      var saved = localStorage.getItem('muorg-theme') || 'auto';
      setTheme(ORDER.includes(saved) ? saved : 'auto');
    })();
  </script>
</body>
</html>
