[package]
name = "muorg-core"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.25"
id3 = "1.16"
walkdir = "2"
base64 = "0.23"
sha2 = "0.11"
utoipa = { version = "5", optional = true }
rust_cast = { version = "0.14", optional = true }
mdns-sd = { version = "0.21", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
# Derives `ToSchema` on the wire types so muorg-server can generate the OpenAPI
# document straight from the structs its handlers actually serialize. Off by
# default: the desktop app links muorg-core too and has no use for it.
openapi = ["dep:utoipa"]
# Chromecast discovery and session handling. Off by default: a consumer that
# only needs the catalog should not pull in rust_cast and mdns-sd.
cast = ["dep:rust_cast", "dep:mdns-sd"]
