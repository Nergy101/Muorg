<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1917" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- No apple-mobile-web-app-status-bar-style: black-translucent makes iOS 26+
         draw a system blur/fade over the top edge that CSS can't disable. Without
         it iOS shows an opaque status bar coloured from theme-color. -->
    <meta name="apple-mobile-web-app-title" content="Muorg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

    <!-- PWA manifest (handled by vite-plugin-pwa) -->
    <link rel="manifest" href="./manifest.webmanifest" />

    <title>Muorg Web</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
