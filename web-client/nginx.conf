server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: all unknown routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache built assets (hashed filenames) for 1 year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No cache for index.html
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Service worker must never be cached so updates propagate immediately
    location = /sw.js {
        add_header Cache-Control "no-store";
    }

    # SW registration script and manifest should always be fresh
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        add_header Content-Type "application/manifest+json";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;
}
